name: Backup safety and native transfer verification
on:
  pull_request:
  push:
    branches: [swag]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rsync
      - if: runner.os != 'Windows'
        run: command -v rsync
      - run: npm ci
      - run: npm test
